    </g>
    <text x="56" y="163" font-size="54" font-weight="700" letter-spacing="-2" fill="#f0f6f5">Make room for</text>
    <text x="56" y="226" font-size="54" font-weight="700" letter-spacing="-2" fill="#76efc2">your next idea.</text>
    <text x="58" y="272" font-size="21" fill="#b4c6cc">Forecast limits. Guard agents. Trim context.</text>
