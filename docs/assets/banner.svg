<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">limitcast — Make room for your next idea.</title>
  <desc id="description">A local CLI for forecasting AI coding limits, guarding subagents, and trimming context. An illustrative usage curve approaches a limit, with a forecast extending ahead of current usage.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101c25"/>
      <stop offset="1" stop-color="#091116"/>
    </linearGradient>
    <linearGradient id="area" x2="0" y2="1">
      <stop stop-color="#76efc2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#76efc2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="440" rx="20" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(56 52)">
