<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Trim — inspect unused starting context before changing settings</title>
  <desc id="desc">Illustrative estimate: 102.7 thousand starting-context tokens, with 6.2 thousand estimated removable tokens, or 6 percent. Apply changes explicitly; keep lists, backups, and undo are available.</desc>
  <rect width="640" height="300" rx="16" fill="#101c25"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="30" y="46" fill="#76efc2" font-size="25" font-weight="650">Carry less into your next session.</text>
    <text x="30" y="80" fill="#b4c6cc" font-size="19" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">$ limitcast trim --share</text>
    <path d="M30 103h580" stroke="#31444e"/>
    <text x="30" y="158" fill="#f0f6f5" font-size="43" font-weight="650">102.7k</text>
    <text x="33" y="189" fill="#b4c6cc" font-size="20">starting tokens</text>
    <path d="M245 151h65m-10-10 10 10-10 10" fill="none" stroke="#76efc2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="352" y="158" fill="#76efc2" font-size="43" font-weight="650">6.2k</text>
    <text x="355" y="189" fill="#b4c6cc" font-size="20">estimated removable</text>
    <rect x="30" y="214" width="580" height="8" rx="4" fill="#b4c6cc"/>
    <path d="M575 218h31" stroke="#76efc2" stroke-width="8" stroke-linecap="round"/>
    <text x="30" y="274" fill="#b4c6cc" font-size="17">Illustrative estimate · inspect first, apply explicitly</text>
  </g>
</svg>
