<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Limitcast social preview</title>
    <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 1280px;
      height: 640px;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 80% 40%, #252a31, #111317 70%);
      color: #f7f0e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 64px;
      gap: 20px;
    }
    .copy {
      width: 650px;
      position: relative;
      z-index: 1;
    }
    .brand {
      color: #ff9f35;
      font-size: 32px;
      font-weight: 750;
      letter-spacing: -1px;
    }
    h1 {
      font-size: 66px;
      line-height: 1.08;
      letter-spacing: -2px;
      margin: 32px 0 24px;
    }
    h1 span {
      color: #ffb44b;
    }
    p {
      font-size: 25px;
      line-height: 1.6;
      color: #c6c8ce;
      margin: 0;
    }
    .tools {
      color: #f7f0e5;
      font-size: 21px;
      margin-top: 34px;
    }
    .footer {
      color: #ffb44b;
      font-size: 16px;
      letter-spacing: 1px;
      margin-top: 24px;
    }
    img {
      width: 520px;
      height: 520px;
      object-fit: contain;
      margin-left: -38px;
    }
    </style>
  </head>
  <body>
    <main>
      <div class="copy">
        <div class="brand">limitcast</div>
        <h1>See the limit.<br><span>Stay ahead.</span></h1>
        <p>Forecast usage. Guard subagents.<br>Trim the context you never use.</p>
        <p class="tools">Claude Code · Codex · Grok</p>
        <div class="footer">FREE &amp; OPEN SOURCE · LIMITCAST.DEV</div>
      </div>
      <img src="emblem.png" alt="Limitcast capacity gauge connected to Claude Code, Codex, and Grok badges">
    </main>
  </body>
</html>
